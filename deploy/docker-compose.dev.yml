# 로컬 개발용 S3. Phase 1 은 회사 인프라도 실 AWS 도 건드리지 않는다 (PHASE1.md 범위).
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   docker compose -f deploy/docker-compose.dev.yml down -v
#
# ⚠️ 측정 해석 주의: LocalStack 은 실 S3 가 아니다.
# 여기서 나오는 업로드 시간은 루프백 + LocalStack 오버헤드이지 네트워크 지연이 아니다.
# W3 에서 이 숫자로 답할 수 있는 것은 "파일 크기 / 파트 크기에 따른 상대적 경향"까지이고,
# 절대 처리량은 W8(실 AWS)에서 다시 잰다.

services:
  localstack:
    image: localstack/localstack:2026.07.2
    container_name: ts-tiering-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-northeast-2
      # 컨테이너를 내리면 버킷도 사라진다. 벤치마크는 매번 깨끗한 상태에서 시작하는 편이 낫다.
      PERSISTENCE: 0
      DEBUG: 0
    volumes:
      # ready.d 훅은 서비스가 뜬 뒤 실행된다. awslocal 은 이미지 안에 들어 있다.
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
